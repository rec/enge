[package]
name = "enge-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]
members = ["crates/rubberband"]

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
allocation-audit = []
rubberband = ["dep:enge-rubberband"]

[dependencies]
envelfo-core = { git = "ssh://git@github.com/rec/envelfo.git", rev = "ea35332" }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
rtrb = "0.4.0"
enge-rubberband = { path = "crates/rubberband", optional = true }
realfft = "3.5.1"
sha2 = "0.10.9"
