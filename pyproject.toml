[project]
name = "enge"
version = "0.1.0"
description = "Offline sound-engine contracts for Ufor instruments"
readme = "README.md"
authors = [
    { name = "Tom Ritchford", email = "tom@swirly.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.1",
    "ufor",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
ufor = { path = "../ufor", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
