[project]
name = "enge"
version = "0.1.0"
description = "Offline sound-engine contracts for Ufor instruments"
readme = "README.md"
authors = [
    { name = "Tom Ritchford", email = "tom@swirly.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.1",
    "pydantic>=2.13.4",
    "ufor",
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "enge._native"

[tool.uv.sources]
ufor = { path = "../ufor", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
